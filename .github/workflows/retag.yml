name: retag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release tags to the rewritten commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in "v0.2.1 846d2085cb9dffce2fd608f8f35a788a0609d828" "v0.2.2 7ef9b6b" "v0.2.3 431da02" "v0.2.4 a200947"; do
            set -- $p
            git rev-parse --verify "$2^{commit}"
            git tag -f "$1" "$2"
          done
          git push -f origin v0.2.1 v0.2.2 v0.2.3 v0.2.4
          git ls-remote origin 'refs/tags/*'
