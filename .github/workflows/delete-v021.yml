name: delete-v021
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release v0.2.1 and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.2.1 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref'
