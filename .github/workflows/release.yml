name: Release (macOS arm64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  mac:
    name: macOS Apple Silicon (DMG)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the CLI wrapper and ad-hoc signature
        run: |
          APP="dist/mac-arm64/Octopus Mail.app"
          codesign --verify --deep --strict "$APP" || codesign -dv "$APP"
          OCTO_HOME="$RUNNER_TEMP/octo" OCTO_SECRETS=memory "$APP/Contents/Resources/octo" help | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: octopus-mail-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
