# OpenMail on a Synology NAS (DS224+ = Intel, linux/amd64) with the prebuilt image.
# Container Manager → Project → Create → paste this file, or over SSH:
#   sudo mkdir -p /volume1/docker/openspark && sudo chown 1000:1000 /volume1/docker/openspark
#   sudo docker compose -f docker-compose.synology.yml up -d
#   Setup code for your account: Container Manager → Container → openspark-mail → Log (or set OPENMAIL_SETUP_CODE below)
# Put it behind the DSM reverse proxy (HTTPS 443 → localhost:8787): see docs/synology.md.
services:
  octopus:
    image: ghcr.io/ugovb/openspark:latest
    container_name: openspark-mail
    restart: unless-stopped
    # only the reverse proxy on the NAS talks to it: never forward 8787 on your router
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /volume1/docker/openspark:/data
    environment:
      TZ: Europe/Paris
      # code that lets you create your account in the browser (8 to 64 letters, digits or hyphens).
      # Without it the server makes one up and prints it in the log.
      # OPENMAIL_SETUP_CODE: "change-me-please"
      # trust X-Forwarded-For / X-Forwarded-Proto from the DSM reverse proxy
      OPENMAIL_TRUST_PROXY: "1"
    mem_limit: 512m
