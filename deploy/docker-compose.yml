# OpenMail — serwer domowy (Docker). Uruchom z katalogu głównego repozytorium:
#   docker compose -f deploy/docker-compose.yml up -d --build
#   Kod konfiguracji konta: docker compose -f deploy/docker-compose.yml logs openmail   (albo ustaw OPENMAIL_SETUP_CODE poniżej)
services:
  openmail:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: openmail
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - octopus-data:/data
    environment:
      TZ: Europe/Warsaw
      # kod do utworzenia konta w przeglądarce (8-64 znaków). Bez tego serwer generuje własny i wypisuje go w logu.
      # OPENMAIL_SETUP_CODE: "change-me-please"

volumes:
  octopus-data:
